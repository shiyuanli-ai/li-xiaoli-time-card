<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <title>李晓丽照片集时间卡</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f3ea;
        --ink: #2f2921;
        --muted: #7b6d5d;
        --gold: #b38a3b;
        --line: #dfd0b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 30% 0%, rgba(190, 150, 88, 0.16), transparent 34rem),
          linear-gradient(180deg, #fffaf2 0%, var(--paper) 58%, #f1e7d7 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }

      main {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 28px 16px 44px;
      }

      header {
        padding: 8px 2px 22px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--gold);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 8vw, 54px);
        line-height: 1.08;
        font-weight: 600;
        letter-spacing: 0;
      }

      .lead {
        max-width: 46em;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.9;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(179, 138, 59, 0.52);
        padding: 0 16px;
        background: rgba(255, 252, 246, 0.78);
        color: #6f5120;
        text-decoration: none;
        font-size: 14px;
      }

      .stage {
        margin-top: 24px;
        border: 1px solid rgba(179, 138, 59, 0.34);
        background: rgba(255, 252, 246, 0.62);
        box-shadow: 0 22px 70px rgba(80, 54, 18, 0.14);
      }

      .stage img {
        display: block;
        width: 100%;
        height: auto;
      }

      footer {
        padding: 22px 2px 0;
        color: #9a8b79;
        font-size: 12px;
        line-height: 1.8;
        text-align: center;
      }

      @media (max-width: 520px) {
        main {
          padding: 20px 10px 34px;
        }

        header {
          padding-left: 4px;
          padding-right: 4px;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Family Memory Time Card</p>
        <h1>李晓丽照片集时间卡</h1>
        <p class="lead">
          对照照片集页码阅读，沿着每一页的时间、地点、人物与故事，慢慢看懂照片里的来路与陪伴。
        </p>
        <div class="actions">
          <a class="button" href="./li-xiaoli-time-card-v2.pdf?v=20260828-story-v3">查看 PDF 版本</a>
          <a class="button" href="./li-xiaoli-time-card-v2.png?v=20260828-story-v3">查看高清长图</a>
        </div>
      </header>

      <section class="stage" aria-label="照片集时间卡">
        <img src="./li-xiaoli-time-card-v2.png?v=20260828-story-v3" alt="李晓丽照片集时间卡" />
      </section>

      <footer>一页一段旧时光，一页一份家人之间的珍重。</footer>
    </main>
  </body>
</html>
